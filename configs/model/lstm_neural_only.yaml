# @package _global_.model

# LSTM with neural-only input (pure neural decoding)

hidden_dim: 256
num_layers: 2
bidirectional: true
rnn_type: "lstm"
input_mode: "neural_only"  # Only neural signals
dropout: 0.2
learning_rate: 1e-3
lambda_velocity: 0.1
weight_decay: 1e-5
scheduler_patience: 5
scheduler_factor: 0.5
