# @package _global_.model

# GRU with multimodal input (ablation study)

hidden_dim: 256
num_layers: 2
bidirectional: true
rnn_type: "gru"  # Use GRU instead of LSTM
input_mode: "multimodal"
dropout: 0.2
learning_rate: 1e-3
lambda_velocity: 0.1
weight_decay: 1e-5
scheduler_patience: 5
scheduler_factor: 0.5
